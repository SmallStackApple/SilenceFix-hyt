name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: .\gradlew.bat clean packageClient --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: SilenceFix-jar
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14

      - name: Upload version package
        uses: actions/upload-artifact@v4
        with:
          name: SilenceFix
          path: build/dist/
          if-no-files-found: error
          retention-days: 14
